<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nkumba Connect | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0B132B] text-slate-100 min-h-screen pb-16">

    <header class="sticky top-0 z-40 bg-[#0B132B]/90 backdrop-blur-md border-b border-[#E0A96D]/20 px-4 py-3 flex items-center justify-between shadow-2xl">
        <div class="flex items-center space-x-2.5">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#E0A96D] to-[#F4D35E] flex items-center justify-center shadow-lg shadow-[#E0A96D]/30 border border-white/20">
                <i class="fa-solid fa-shield-halved text-[#0B132B]"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-wide text-slate-100">Nkumba Connect Admin</h1>
                <p class="text-[10px] text-slate-400 tracking-wider uppercase font-semibold">Listings Moderation</p>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <div class="flex space-x-2 overflow-x-auto pb-3 scrollbar-none" id="adminTabContainer">
            <button onclick="setAdminTab('pending')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition" data-tab="pending">Pending Review</button>
            <button onclick="setAdminTab('approved')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition" data-tab="approved">Live Listings</button>
            <button onclick="setAdminTab('rejected')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition" data-tab="rejected">Spam / Removed</button>
        </div>

        <div id="adminListingsContainer" class="space-y-3 mt-2"></div>
    </main>

    <script>
        let currentAdminTab = 'pending';
        let listings = [];

        function setAdminTab(tab) {
            currentAdminTab = tab;
            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.className = "admin-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-[#E0A96D] text-[#0B132B]";
                } else {
                    btn.className = "admin-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-[#1C2541] text-slate-300 border border-slate-700/50 hover:bg-slate-800";
                }
            });
            renderAdminListings();
        }

        async function renderAdminListings() {
            const container = document.getElementById('adminListingsContainer');
            try {
                const res = await fetch('/api/admin/listings');
                if (!res.ok) throw new Error('Request failed');
                listings = await res.json();
            } catch (e) {
                container.innerHTML = `<div class="text-center py-10 text-rose-400 bg-[#1C2541]/40 rounded-2xl border border-slate-800"><p>Couldn't load listings. Check your connection.</p></div>`;
                return;
            }

            const items = listings.filter(item => item.status === currentAdminTab)
                .sort((a, b) => b.created_at - a.created_at);

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 bg-[#1C2541]/40 rounded-2xl border border-slate-800"><p>Nothing here right now.</p></div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-[#1C2541] border border-slate-700/60 rounded-2xl p-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start space-x-3 flex-1 min-w-0">
                            ${item.image ? `<img src="${item.image}" class="w-16 h-16 rounded-xl object-cover flex-shrink-0 border border-slate-700" />` : `<div class="w-16 h-16 rounded-xl bg-[#0B132B] flex items-center justify-center flex-shrink-0 border border-slate-700"><i class="fa-solid fa-image text-slate-600"></i></div>`}
                            <div class="min-w-0">
                                <p class="text-[10px] uppercase tracking-wide text-[#E0A96D] font-semibold">${item.category}</p>
                                <h4 class="font-bold text-slate-100 truncate">${item.title}</h4>
                                <p class="text-xs text-slate-400 truncate">${item.price} • ${item.location}</p>
                                <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.description || ''}</p>
                                <p class="text-xs text-emerald-400 mt-1 flex items-center">
                                    <i class="fa-brands fa-whatsapp mr-1"></i>
                                    Poster's real number: <span class="font-semibold ml-1">${item.seller_whatsapp || 'n/a'}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-800">
                        ${item.status !== 'approved' ? `<button onclick="adminSetStatus(${item.id}, 'approved')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-check mr-1"></i>Approve</button>` : ''}
                        ${item.status !== 'rejected' ? `<button onclick="adminSetStatus(${item.id}, 'rejected')" class="bg-amber-600/80 hover:bg-amber-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-flag mr-1"></i>Mark Spam / Fake</button>` : ''}
                        ${item.status !== 'pending' ? `<button onclick="adminSetStatus(${item.id}, 'pending')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Move to Pending</button>` : ''}
                        <button onclick="adminDeleteListing(${item.id})" class="bg-rose-700 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-trash mr-1"></i>Delete Permanently</button>
                    </div>
                </div>
            `).join('');
        }

        async function adminSetStatus(id, status) {
            try {
                const res = await fetch('/api/listings/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (!res.ok) throw new Error('Request failed');
                renderAdminListings();
            } catch (e) {
                alert("Couldn't update that listing. Check your connection and try again.");
            }
        }

        async function adminDeleteListing(id) {
            if (!confirm('Delete this post permanently? This cannot be undone.')) return;
            try {
                const res = await fetch('/api/listings/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error('Request failed');
                renderAdminListings();
            } catch (e) {
                alert("Couldn't delete that listing. Check your connection and try again.");
            }
        }

        setAdminTab(currentAdminTab);
    </script>

    <!-- Footer -->
    <footer class="text-center py-6 text-[11px] text-slate-500 border-t border-slate-800 mt-8">
        © 2026 Clean Money Avenue Media & Technology Group Ltd. All rights reserved.<br>
        <span class="text-slate-600">Founder: Raphael "Cybercity"</span>
    </footer>
</body>
</html>
